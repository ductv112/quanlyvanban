# ─────────────────────────────────────────────────────────────────────────────
# Composite Action: Setup Test Stack
# ─────────────────────────────────────────────────────────────────────────────
# Re-usable action shared bởi 2 job test-pr.yml (integration-tests + e2e-smoke).
# Cài Node 20 + npm install root + backend + tools/mocks + tools/test-report,
# optional cài Playwright Chromium (cache để giảm thời gian boot CI).
#
# CLAUDE.md pitfall #2: NODE_ENV=development BẮT BUỘC khi npm install/ci để
# có đầy đủ devDependencies (typescript, vitest, tsx, playwright). KHÔNG dùng
# install flags loại bỏ dev deps khi cài.
#
# Usage trong workflow:
#   steps:
#     - uses: actions/checkout@v4
#     - uses: ./.github/actions/setup-test-stack
#       with:
#         install-playwright: 'true'   # default 'false', set 'true' cho e2e job
#
# Created: 2026-05-06 — Phase 21 Plan 06 (REQ CI-01, CI-02, CI-06, CI-07)
# ─────────────────────────────────────────────────────────────────────────────

name: 'Setup Test Stack'
description: 'Cài Node 20 + npm deps cho backend/mocks/test-report/root + optional Playwright Chromium (cache).'

inputs:
  install-playwright:
    description: 'Cài Playwright Chromium browser + system deps. Set true cho e2e-smoke job, false cho integration-tests.'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup Node 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          e_office_app_new/backend/package-lock.json
          e_office_app_new/frontend/package-lock.json
          tools/mocks/package-lock.json
          tools/test-report/package-lock.json

    - name: Install root deps (Playwright + dotenv orchestrator)
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        NODE_ENV: development
      run: |
        if [ -f package.json ] && [ -f package-lock.json ]; then
          npm ci
        elif [ -f package.json ]; then
          npm install
        else
          echo "[setup-test-stack] No root package.json — skip"
        fi

    - name: Install backend deps (vitest + supertest + nock + tsx)
      shell: bash
      working-directory: ${{ github.workspace }}/e_office_app_new/backend
      env:
        NODE_ENV: development
      run: npm ci

    - name: Install mocks deps (express + tsx)
      shell: bash
      working-directory: ${{ github.workspace }}/tools/mocks
      env:
        NODE_ENV: development
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi

    - name: Install test-report deps (exceljs)
      shell: bash
      working-directory: ${{ github.workspace }}/tools/test-report
      env:
        NODE_ENV: development
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi

    # ─── Playwright section: chỉ chạy khi e2e-smoke job kéo về ───
    - name: Cache Playwright browsers
      if: inputs.install-playwright == 'true'
      uses: actions/cache@v4
      id: pw-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install Playwright Chromium (cache miss)
      if: inputs.install-playwright == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      run: npx playwright install chromium --with-deps

    - name: Install Playwright system deps only (cache hit — browser đã có)
      if: inputs.install-playwright == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      run: npx playwright install-deps chromium
